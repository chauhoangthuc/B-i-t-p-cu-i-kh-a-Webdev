<!DOCTYPE html>
<html class="light" lang="vi">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Đăng ký | TripManager</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap"
        rel="stylesheet">
    <!-- Material Symbols Outlined -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet">
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#005ac2",
                        "tertiary-fixed": "#d4e3ff",
                        "on-tertiary-fixed": "#001c39",
                        "on-secondary-container": "#586377",
                        "on-surface": "#191c1d",
                        "secondary-fixed": "#d8e3fb",
                        "on-surface-variant": "#424754",
                        "on-secondary-fixed-variant": "#3c475a",
                        "on-primary-fixed-variant": "#004395",
                        "inverse-primary": "#adc6ff",
                        "primary-fixed": "#d8e2ff",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#2676c8",
                        "primary-container": "#2170e4",
                        "outline-variant": "#c2c6d6",
                        "tertiary": "#005da8",
                        "surface-bright": "#f8f9fa",
                        "primary-fixed-dim": "#adc6ff",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#e1e3e4",
                        "on-tertiary-fixed-variant": "#004883",
                        "secondary-container": "#d5e0f8",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2e3132",
                        "background": "#f8f9fa",
                        "on-primary-fixed": "#001a42",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-container-highest": "#e1e3e4",
                        "on-tertiary-container": "#fdfcff",
                        "on-primary-container": "#fefcff",
                        "on-background": "#191c1d",
                        "surface": "#f8f9fa",
                        "secondary-fixed-dim": "#bcc7de",
                        "error": "#ba1a1a",
                        "surface-container": "#edeeef",
                        "secondary": "#545f73",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#a4c9ff",
                        "on-error": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container-high": "#e7e8e9",
                        "primary": "#0058be",
                        "on-secondary-fixed": "#111c2d",
                        "surface-container-lowest": "#ffffff",
                        "outline": "#727785",
                        "surface-dim": "#d9dadb",
                        "surface-container-low": "#f3f4f5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "xs": "4px",
                        "sidebar-width": "240px",
                        "lg": "24px",
                        "gutter": "24px",
                        "container-max": "1280px",
                        "base": "4px",
                        "md": "16px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "label-md": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "label-sm": ["Inter"]
                    },
                    "fontSize": {
                        "label-md": ["12px", { "lineHeight": "1", "letterSpacing": "0.01em", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-sm": ["18px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "1", "fontWeight": "600" }]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.05);
        }

        .bg-animated {
            background: radial-gradient(circle at top right, #d8e2ff 0%, transparent 40%),
                radial-gradient(circle at bottom left, #d4e3ff 0%, transparent 40%);
        }

        input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(0, 88, 190, 0.2);
        }

        .shimmer {
            background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.2) 50%, rgba(255, 255, 255, 0) 100%);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }
    </style>
</head>

<body class="bg-background text-on-background min-h-screen font-body-md bg-animated overflow-x-hidden">
    <!-- TopAppBar -->
    <header
        class="w-full h-16 sticky top-0 flex justify-between items-center px-lg z-40 backdrop-blur-md bg-white/80 border-b border-outline-variant transition-all duration-300">
        <div class="flex items-center gap-sm">
            <div class="flex items-center gap-xs">
                <span class="material-symbols-outlined text-primary"
                    style="font-variation-settings: 'FILL' 1;">public</span>
                <span class="material-symbols-outlined text-primary">flight_takeoff</span>
            </div>
            <h1 class="text-headline-md font-headline-md font-bold text-on-surface tracking-tight">TripManager</h1>
        </div>
        <div class="flex items-center gap-md">
            <a class="text-label-md font-label-md text-primary hover:underline transition-all" href="#">Trợ giúp</a>
        </div>
    </header>
    <main class="flex flex-col items-center justify-center py-xl px-md">
        <!-- Main Registration Card -->
        <div
            class="glass-card w-full max-w-[480px] rounded-xl p-lg md:p-xl transition-all duration-500 animate-[fadeIn_0.5s_ease-out]">
            <!-- Headings -->
            <div class="text-center mb-xl">
                <h2 class="text-headline-lg font-headline-lg text-on-surface mb-xs tracking-tight">Tạo tài khoản mới
                </h2>
                <p class="text-body-md font-body-md text-on-surface-variant opacity-80">Tham gia cùng chúng tôi ngay hôm
                    nay</p>
            </div>
            <form class="space-y-md" id="registrationForm">
                <!-- Full Name Field -->
                <div class="space-y-xs">
                    <label class="text-label-md font-label-md text-on-surface-variant ml-xs" for="fullName">Họ và
                        tên</label>
                    <div class="relative group">
                        <span
                            class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
                        <input
                            class="w-full pl-xl pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md focus:border-primary transition-all"
                            id="fullName" name="fullName" placeholder="Nguyễn Văn A" required="" type="text">
                    </div>
                </div>
                <!-- Email Field -->
                <div class="space-y-xs">
                    <label class="text-label-md font-label-md text-on-surface-variant ml-xs" for="email">Email</label>
                    <div class="relative group">
                        <span
                            class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">mail</span>
                        <input
                            class="w-full pl-xl pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md focus:border-primary disabled:bg-surface-container disabled:cursor-not-allowed transition-all"
                            id="email" name="email" placeholder="email@example.com" required="" type="email">
                    </div>
                    <p class="hidden text-[10px] bg-secondary-container text-on-secondary-container px-sm py-xs rounded inline-block mt-xs font-semibold"
                        id="inviteBadge">Được mời tham gia</p>
                </div>
                <!-- Password Field -->
                <div class="space-y-xs">
                    <label class="text-label-md font-label-md text-on-surface-variant ml-xs" for="password">Mật
                        khẩu</label>
                    <div class="relative group">
                        <span
                            class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
                        <input
                            class="w-full pl-xl pr-[48px] py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md focus:border-primary transition-all"
                            id="password" minlength="8" name="password" placeholder="••••••••" required=""
                            type="password">
                        <button
                            class="absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors"
                            onclick="togglePasswordVisibility('password')" type="button">
                            <span class="material-symbols-outlined" id="passwordToggleIcon">visibility</span>
                        </button>
                    </div>
                    <!-- Strength indicator -->
                    <div class="flex gap-xs mt-xs h-1 px-xs">
                        <div class="h-full flex-1 bg-surface-container rounded-full transition-colors" id="str-1"></div>
                        <div class="h-full flex-1 bg-surface-container rounded-full transition-colors" id="str-2"></div>
                        <div class="h-full flex-1 bg-surface-container rounded-full transition-colors" id="str-3"></div>
                    </div>
                </div>
                <!-- Confirm Password Field -->
                <div class="space-y-xs">
                    <label class="text-label-md font-label-md text-on-surface-variant ml-xs" for="confirmPassword">Xác
                        nhận mật khẩu</label>
                    <div class="relative group">
                        <span
                            class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">verified_user</span>
                        <input
                            class="w-full pl-xl pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-lg font-body-md focus:border-primary transition-all"
                            id="confirmPassword" name="confirmPassword" placeholder="••••••••" required=""
                            type="password">
                    </div>
                    <p class="hidden text-error text-[12px] mt-xs" id="passwordMismatch">Mật khẩu không khớp.</p>
                </div>
                <!-- Terms Checkbox -->
                <div class="flex items-start gap-sm py-xs">
                    <input
                        class="mt-1 w-4 h-4 text-primary border-outline rounded focus:ring-primary focus:ring-offset-0 transition-all"
                        id="terms" name="terms" required="" type="checkbox">
                    <label class="text-body-md text-on-surface-variant leading-tight" for="terms">
                        Tôi đồng ý với <a class="text-primary font-semibold hover:underline" href="#">Điều khoản dịch
                            vụ</a> và <a class="text-primary font-semibold hover:underline" href="#">Chính sách bảo
                            mật</a>.
                    </label>
                </div>
                <!-- Primary Action Button -->
                <button
                    class="w-full relative overflow-hidden bg-primary text-white font-bold py-md rounded-lg shadow-lg hover:shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-sm"
                    id="submitBtn" type="submit">
                    <span class="relative z-10">ĐĂNG KÝ</span>
                    <span class="material-symbols-outlined relative z-10 text-[20px]">arrow_forward</span>
                </button>
                <!-- Divider -->
                <div class="flex items-center gap-md py-md">
                    <div class="flex-1 h-[1px] bg-outline-variant"></div>
                    <span class="text-label-md text-on-surface-variant/60 font-medium">Hoặc</span>
                    <div class="flex-1 h-[1px] bg-outline-variant"></div>
                </div>
                <!-- Social Sign-up -->
                <button
                    class="w-full bg-white border border-outline-variant text-on-surface py-md rounded-lg font-semibold flex items-center justify-center gap-md hover:bg-surface-container-low transition-colors shadow-sm"
                    type="button">
                    <svg height="20" viewBox="0 0 20 20" width="20">
                        <path
                            d="M19.6 10.23c0-.66-.06-1.29-.17-1.9H10v3.59h5.38c-.23 1.25-.94 2.31-2 2.97v2.47h3.24c1.89-1.74 2.98-4.31 2.98-7.13z"
                            fill="#4285F4"></path>
                        <path
                            d="M10 20c2.7 0 4.96-.9 6.61-2.43l-3.24-2.47c-.9.6-2.05.96-3.37.96-2.59 0-4.78-1.75-5.57-4.11H1.34v2.55C3 17.58 6.3 20 10 20z"
                            fill="#34A853"></path>
                        <path
                            d="M4.43 11.95c-.2-.6-.31-1.23-.31-1.95s.11-1.35.31-1.95V5.5H1.34C.48 7.21 0 9.13 0 11s.48 3.79 1.34 5.5l3.09-2.55z"
                            fill="#FBBC05"></path>
                        <path
                            d="M10 3.94c1.47 0 2.79.5 3.82 1.49l2.87-2.87C14.96.93 12.7 0 10 0 6.3 0 3 2.42 1.34 5.5l3.09 2.55c.79-2.36 2.98-4.11 5.57-4.11z"
                            fill="#EA4335"></path>
                    </svg>
                    Đăng ký bằng Google
                </button>
            </form>
            <!-- Footer Link -->
            <div class="mt-xl text-center">
                <p class="text-body-md text-on-surface-variant">
                    Đã có tài khoản?
                    <a class="text-primary font-bold hover:underline transition-all ml-xs" href="login.html">Đăng nhập
                        ngay</a>
                </p>
            </div>
        </div>
    </main>
    <footer class="mt-auto py-lg text-center opacity-40 text-on-surface-variant text-label-sm">
        © 2024 TripManager. Hệ thống quản lý hành trình chuyên nghiệp.
    </footer>
    <script>
        // Handle invite token flow
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const inviteToken = params.get('invite');
            const emailField = document.getElementById('email');
            const inviteBadge = document.getElementById('inviteBadge');

            if (inviteToken) {
                // In a real scenario, we would fetch the email associated with the token via API
                // For this UI mockup, we simulate pre-filling a specific email
                const dummyInviteEmail = "member.invited@company.com";
                emailField.value = dummyInviteEmail;
                emailField.setAttribute('readonly', 'true');
                emailField.classList.add('bg-surface-container');
                inviteBadge.classList.remove('hidden');

                console.log('Processing invite token:', inviteToken);
            }
        });

        // Toggle password visibility
        function togglePasswordVisibility(id) {
            const input = document.getElementById(id);
            const icon = document.getElementById('passwordToggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // Password strength meter logic
        const passwordInput = document.getElementById('password');
        const strBars = [document.getElementById('str-1'), document.getElementById('str-2'), document.getElementById('str-3')];

        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            let strength = 0;
            if (val.length > 0) strength = 1;
            if (val.length > 7) strength = 2;
            if (val.length > 10 && /[A-Z]/.test(val) && /[0-9]/.test(val)) strength = 3;

            strBars.forEach((bar, index) => {
                bar.className = 'h-full flex-1 rounded-full transition-colors';
                if (index < strength) {
                    if (strength === 1) bar.classList.add('bg-error');
                    else if (strength === 2) bar.classList.add('bg-amber-400');
                    else bar.classList.add('bg-primary');
                } else {
                    bar.classList.add('bg-surface-container');
                }
            });
        });

        // Form Validation & Submission Mock
        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const confirmInput = document.getElementById('confirmPassword');
        const mismatchError = document.getElementById('passwordMismatch');

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            // Check if passwords match
            if (passwordInput.value !== confirmInput.value) {
                mismatchError.classList.remove('hidden');
                confirmInput.classList.add('border-error');
                return;
            } else {
                mismatchError.classList.add('hidden');
                confirmInput.classList.remove('border-error');
            }

            // Simulate loading state
            const originalContent = submitBtn.innerHTML;
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <div class="shimmer absolute inset-0 opacity-20"></div>
                <span class="animate-pulse">ĐANG XỬ LÝ...</span>
            `;

            // Mock API Call
            setTimeout(() => {
                const params = new URLSearchParams(window.location.search);
                const inviteToken = params.get('invite');

                alert('Tài khoản đã được khởi tạo thành công!');

                // If invite present, route to specific confirmation or dashboard
                if (inviteToken) {
                    console.log('Redirecting to organization workspace...');
                    window.location.href = '/dashboard/welcome-invite';
                } else {
                    window.location.href = '/onboarding';
                }
            }, 1500);
        });

        // Reset mismatch error on input
        confirmInput.addEventListener('input', () => {
            mismatchError.classList.add('hidden');
            confirmInput.classList.remove('border-error');
        });
    </script>
</body>

</html>
